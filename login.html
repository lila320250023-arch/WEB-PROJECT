<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <title>Staff sign in – JustWait</title>
</head>
<body data-page="login">
    <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">Q</span>
      <span><strong>JustWait</strong><small>Student Services</small></span></a>
    <nav class="header-actions" aria-label="Main">
      <span class="status">Services available</span>
      <a class="staff" href="login.html">Staff sign in</a>
    </nav>
  </header>
  <main class="page">
    <section class="login-box">
      <p class="eyebrow">Staff area</p>
      <h1>Staff sign in</h1>
      <form id="login-form" novalidate>
        <div class="field"><div class="field-head"><label for="email">Email</label></div>
          <input id="email" type="email" placeholder="staff@justwait.edu" autocomplete="username"></div>
        <div class="field"><div class="field-head"><label for="password">Password</label></div>
          <input id="password" type="password" autocomplete="current-password">
          <p class="hint">Prototype login: staff@justwait.edu / staff123</p>
          <p class="error" id="login-error" role="alert"></p></div>
        <button class="btn" type="submit">Sign in →</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
